[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nullroute"
version = "1.0.0"
description = "NULLROUTE — JavaScript reconnaissance & secret extraction // DEDSEC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DEDSEC"}]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.3"]

[project.scripts]
nullroute = "nullroute.__main__:main"

[tool.setuptools]
packages = [
    "nullroute",
    "nullroute.core",
    "nullroute.recon",
    "nullroute.analyzers",
    "nullroute.report",
    "nullroute.data",
]
